name: EthioMentor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect build system
        id: detect
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then
            echo "system=gradle" >> "$GITHUB_OUTPUT"
          elif [[ -f ./pom.xml ]]; then
            echo "system=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f ./build.gradle || -f ./build.gradle.kts ]]; then
            echo "system=gradle-installed" >> "$GITHUB_OUTPUT"
          else
            echo "system=plain-java" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected build system:"
          cat "$GITHUB_OUTPUT"

      - name: Set up Gradle
        if: steps.detect.outputs.system == 'gradle' || steps.detect.outputs.system == 'gradle-installed'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.detect.outputs.system == 'gradle'
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        if: steps.detect.outputs.system == 'gradle'
        run: ./gradlew --no-daemon build

      - name: Build with installed Gradle
        if: steps.detect.outputs.system == 'gradle-installed'
        run: gradle --no-daemon build

      - name: Build with Maven Wrapper
        if: steps.detect.outputs.system == 'maven' && hashFiles('mvnw') != ''
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp verify

      - name: Build with Maven
        if: steps.detect.outputs.system == 'maven' && hashFiles('mvnw') == ''
        run: mvn -B -ntp verify

      - name: Verify plain Java/JSP project structure
        if: steps.detect.outputs.system == 'plain-java'
        shell: bash
        run: |
          echo "No Gradle or Maven build configuration was found."
          echo "Checking the Java web application structure."

          test -d src/main/java || {
            echo "::error::Missing src/main/java directory."
            exit 1
          }

          test -d src/main/webapp || {
            echo "::error::Missing src/main/webapp directory."
            exit 1
          }

          count=$(find src/main/java -type f -name '*.java' | wc -l)
          echo "Java source files found: $count"

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No Java source files found."
            exit 1
          fi

          echo "::warning::This job checks project structure only. It does not compile JSP files or verify deployment."

      - name: Check for unresolved merge-conflict markers
        if: always() && steps.detect.outcome == 'success'
        shell: bash
        run: |
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- \
            '*.java' '*.jsp' '*.jspx' '*.xml' '*.properties' \
            '*.gradle' '*.gradle.kts' '*.js' '*.css' '*.html' '*.yml' '*.yaml'; then
            echo "::error::Potential merge-conflict markers found. Review the matches before merging."
            exit 1
          else
            echo "No matching conflict markers found in tracked files."
          fi
